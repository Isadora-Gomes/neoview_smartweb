[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pisotatil"
version = "1.0.0"
authors = [
    {name = "Sistema de Detecção de Pisos Táteis"},
]
description = "Biblioteca para detecção de pisos táteis usando visão computacional"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
keywords = ["computer-vision", "opencv", "tactile-paving", "accessibility", "yolo", "detection"]

dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pyyaml>=6.0",
    "pathlib2>=2.3.7",
    "configparser>=5.3.0",
]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0", 
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
all = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0", 
    "scikit-learn>=1.3.0",
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
pisotatil-test = "teste_rapido:main"
pisotatil-exemplo = "exemplo_uso:main"

[project.urls]
Homepage = "https://github.com/seu-usuario/neoview-piso"
Documentation = "https://github.com/seu-usuario/neoview-piso/blob/main/README.md"
Repository = "https://github.com/seu-usuario/neoview-piso"
Issues = "https://github.com/seu-usuario/neoview-piso/issues"

[tool.setuptools]
packages = ["pisotatil", "pisotatil.detection", "pisotatil.training", "pisotatil.utils", "config"]

[tool.setuptools.package-data]
pisotatil = ["*.conf", "*.yaml", "*.yml"]
config = ["*.conf"]
