# Configurações do projeto de detecção de pisos táteis

[detection]
# Parâmetros para detecção de círculos (pontos táteis)
hough_circles_dp = 1
hough_circles_min_dist = 20
hough_circles_param1 = 50
hough_circles_param2 = 30
hough_circles_min_radius = 5
hough_circles_max_radius = 25

# Parâmetros para detecção de linhas (piso direcional)
hough_lines_rho = 1
hough_lines_theta = 0.017453  # pi/180
hough_lines_threshold = 100
hough_lines_min_line_length = 50
hough_lines_max_line_gap = 10

# Parâmetros de pré-processamento
gaussian_blur_kernel = 5
clahe_clip_limit = 2.0
clahe_tile_grid_size = 8
bilateral_filter_d = 9
bilateral_filter_sigma_color = 75
bilateral_filter_sigma_space = 75

# Limiares de validação
contrast_threshold = 15
min_parallel_lines = 3
angle_tolerance = 10

[yolo]
# Configurações do modelo YOLO
model_name = yolov8n.pt
img_size = 640
batch_size = 16
epochs = 800
learning_rate = 0.01
confidence_threshold = 0.5
iou_threshold = 0.45
device = 0

# Configurações de treinamento
patience = 100
save_period = 10
cache = true
workers = 4
verbose = true

[dataset]
# Configurações do dataset
train_ratio = 0.7
val_ratio = 0.2
test_ratio = 0.1
classes = piso_tatil_direcional,piso_tatil_alerta,piso_tatil_direcional_vertical,piso_tatil_direcional_horizontal,piso_tatil
num_classes = 2

[logging]
# Configurações de logging
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
file_handler = true
console_handler = true
log_file = logs/piso_tatil.log

[performance]
# Configurações de performance
monitor_window_size = 100
fps_display_interval = 30
save_detections = false
detection_output_dir = output/detections
